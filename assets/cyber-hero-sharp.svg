<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-label="Zubair Usman. AI Security Researcher, Penetration Tester and Python Automation Engineer.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060e17"/><stop offset=".5" stop-color="#030609"/><stop offset="1" stop-color="#031720"/></linearGradient>
  <radialGradient id="glow" cx=".21" cy=".5" r=".55"><stop stop-color="#07b5cb" stop-opacity=".19"/><stop offset="1" stop-color="#07b5cb" stop-opacity="0"/></radialGradient>
  <linearGradient id="portraitMask" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".84" stop-color="#fff"/><stop offset="1" stop-color="#aaa"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#195064" stroke-width=".65" fill="none"/></pattern>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1c7c87" opacity=".34"/></pattern>
  <clipPath id="pic"><rect x="51" y="48" width="305" height="320" rx="1"/></clipPath>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .title{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:2.2px}
    @keyframes slide{from{transform:translateY(-350px);opacity:0}10%{opacity:.34}95%{opacity:.24}to{transform:translateY(340px);opacity:0}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes fade{0%,100%{opacity:.42}50%{opacity:.95}}
    @keyframes sweep{0%{stroke-dashoffset:160}100%{stroke-dashoffset:0}}
    .scan{animation:slide 7s linear infinite}
    .caret{animation:blink 1.15s steps(1,end) infinite}
    .pulse{animation:fade 2.8s ease-in-out infinite}
    .trace{animation:sweep 8s linear infinite}
  </style>
</defs>
